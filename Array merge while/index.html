<!DOCTYPE html>
<html lang="en">
<head>
    <title>ARRAY MERGING WHILE LOOP</title>
</head>
<body>

  <script>
    let data = [11, 23, 36, 434, 523];
    let data2 = [11, 23, 36, 434, 523];
    let data3 = [];
    let d1 = 0;
    let d2 = 0;
    let d3 = 0;

    while(d1 < data.length && d2 < data2.length){
        if(data[d1] < data2[d2]){
            data3[d3] = data[d1];
            d1++;
        }else{
            data3[d3] = data2[d2];
            d2++;
        }
        d3++;
    }

    while(d1 < data.length){
        data3[d3] = data[d1];
        d1++;
        d3++;
    }

    console.log(data3)
  </script>      
</body>
</html>
