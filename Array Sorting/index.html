<!DOCTYPE html>
<html lang="en">
<head>
    <title>ARRAY SORTING</title>
</head>
<body>

  <script>
    let data = [23 , 12 ,24 , 45 , 67 , 89 , 90 , 34 , 56];

    for(let i = 0; i < data.length; i++){
        for(let j = 0; j < data.length - 1; j++){
            if(data[j] > data[j + 1]){
                let temp = data[j];
                data[j] = data[j + 1];
                data[j + 1] = temp;
            }
        }
    }
    console.log(data);
  </script>      
</body>
</html>
