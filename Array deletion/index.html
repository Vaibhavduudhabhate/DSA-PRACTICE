<!DOCTYPE html>
<html lang="en">
<head>
    <title>ARRAY DELETION</title>
</head>
<body>


  <script>
    let arr = [11, 23, 36, 434, 523];
    let position = 2;
    // console.log(arr);
    for(let i = position; i < arr.length - 1; i++){
        arr[i] = arr[i+1];
    }
    arr.length = arr.length - 1;
    
    console.log(arr)
  </script>      
</body>
</html>
