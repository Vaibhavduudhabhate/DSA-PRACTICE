<!DOCTYPE html>
<html lang="en">
<head>
    <title>ARRAY TRAVERSING</title>
</head>
<body>
    <input type="text" name="" id="index">
    <button onclick="getElement()">
        Get Element
    </button>
  <script>
    let arr = [11, 23, 36, 434, 523];
    // for (let i = 0; i < arr.length; i++) {
    //     document.write(` Array ${i} is ${arr[i]} <br />`);
    // }

    function getElement(){
        let elm = document.getElementById("index").value;
        if(elm < arr.length && typeof parseInt(elm) === "number"){
            alert(arr[elm]);
        } else {
            alert(`Index out of bounds`);
        }
    }
  </script>      
</body>
</html>
